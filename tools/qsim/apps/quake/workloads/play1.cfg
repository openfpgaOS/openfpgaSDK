// qsim workload play1: a live single-player game (README "Harden B").  Generated by gen_play1.py.
// qsim ... --file play1.cfg=workloads/play1.cfg --args "+exec play1.cfg +host_framerate 0.1"
//          --window-on QSIM_WINDOW --window-end-on QSIM_WINDOW_END --end-on QSIM_END
// (run.sh <elf> <out> play1 and gate.sh do this.)  Every "wait" ends one host frame
// (0.1 s), so the timeline is in host frames.
//
// e3m1 (Termination Central), skill 1.  Nothing fights near the start, so the player
// flies (noclip) to the deathmatch spot (616 -1128 -56) next to grunts,
// enforcers and dogs, turns noclip off and fights with god mode, all weapons and quad
// damage (measurement window).  Then: scoreboard, view sizes, menus, console, a
// screenshot, and a noclip flight into the exit trigger, which starts the intermission.
// Noclip: velocity = wish velocity (no z from forward), clamped to 320; a key counts 0.5
// the frame it goes down, 1.0 while held, 0 the frame it is released; "+left;wait;-left"
// turns cl_yawspeed/20 degrees.
map e3m1
alias w5 "wait;wait;wait;wait;wait"
alias w10 "w5;w5"
alias w50 "w10;w10;w10;w10;w10"
alias tl "+left;wait;-left"
alias tr "+right;wait;-right"
w10;w10
god
impulse 9
w5
impulse 7
noclip
wait
// down 128 units: 7 frames
+movedown
wait;wait;wait;wait;wait;wait
-movedown
// turn -180.0 degrees
cl_yawspeed 3600.0
tr
// forward 1480 units: 47 frames
+forward
wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait
-forward
wait
noclip
w5
echo QSIM_WINDOW
// -- fight: rockets under quad damage, turning slowly
impulse 255
+attack
cl_yawspeed 40
+left
w50;w50
// super nailgun, strafe and jump
impulse 5
+moveleft
w10
-moveleft
+jump
wait
-jump
w50;w50
-left
// lightning gun, turn back the other way, walk forward and back
impulse 255
impulse 8
+right
w50
+forward
w10
-forward
w10;w10;w10
+back
w10
-back
w50
-right
// grenades, then rockets again
impulse 6
cl_yawspeed 900
tl
w50
tl
w50
impulse 255
impulse 7
cl_yawspeed 40
+left
w50;w50
-left
// super shotgun and nailgun on the run
impulse 3
+forward
+speed
w10
-forward
-speed
cl_yawspeed 1800
tr
w10;w10
impulse 4
+moveright
w10
-moveright
+jump
wait
-jump
w10;w10;w10
-attack
echo QSIM_WINDOW_END
// -- user interface (outside the measurement window)
+showscores
w10;w10
-showscores
sizedown
sizedown
w10;w5
sizeup
sizeup
sizeup
sizeup
w10;w5
sizedown
sizedown
w5
togglemenu
w10
menu_options
w10
menu_setup
w10
help
w10
togglemenu
togglemenu
w5
toggleconsole
w10
screenshot
w5
toggleconsole
w10
centerview
w10
// -- exit: noclip flight into the trigger_changelevel (legs measured by gen_play1.py)
noclip
wait
cl_yawspeed 3584.4
tr
wait
cl_forwardspeed 319
+forward
wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait
-forward
wait
cl_forwardspeed 400
cl_yawspeed 133.8
tl
wait
cl_forwardspeed 295
+forward
wait;wait;wait;wait;wait;wait;wait;wait;wait
-forward
wait
cl_forwardspeed 400
cl_upspeed 192
+moveup
wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait;wait
-moveup
wait
cl_upspeed 200
// intermission
w10;w10;w10;w10
echo QSIM_END
